on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Java installieren
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - name: Artefakt bauen
        run: bash ./mvnw package

      - name: Gebautes Artefact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: gebautes-jar
          path: target/*.jar