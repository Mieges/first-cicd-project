on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  erfolgreich:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}

    steps:
      - name: Gebautes Artefact herunterladen
        uses: actions/download-artifact@v8
        with:
          name: gebautes-jar
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release erstellen
        run: gh release create ${{ github.event.workflow_run.head_branch }} artifact/*.jar --generate-notes --verify-tag --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  actions: read
  contents: write